name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 147.182.224.36 >> ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to Droplet
        run: |
          ssh root@147.182.224.36 "
          cd ./bot/Tempo-Sapphire &&
          git pull origin main &&
          npm install &&
          npm start
          "
