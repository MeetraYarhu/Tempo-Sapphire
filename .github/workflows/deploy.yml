name: Deploy to Droplet

on:
  push:
    branches:
      - main  # Trigger deployment on push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v2

    # Set up SSH key for deployment
    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H 147.182.224.36 >> ~/.ssh/known_hosts

    # Add npm to PATH
    - name: Add npm to PATH
      run: echo "/root/.nvm/versions/node/v22.13.1/bin" >> $GITHUB_PATH

    # SSH into the droplet and pull the latest changes
    - name: Pull latest changes on Droplet
      run: |
        ssh root@147.182.224.36 "
          cd ./bot/Tempo-Sapphire && 
          git pull origin main
        "

    # Install dependencies (make sure npm is in PATH now)
    - name: Install dependencies
      run: |
        ssh root@147.182.224.36 "
          source ~/.bashrc &&
          cd ./bot/Tempo-Sapphire &&
          npm install
        "

    # Start the app
    - name: Start the app
      run: |
        ssh root@147.182.224.36 "
          cd ./bot/Tempo-Sapphire &&
          npm start
        "
