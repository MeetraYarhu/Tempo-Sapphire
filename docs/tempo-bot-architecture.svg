<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800">
  <defs>
    <style>
      .box { fill: #0d1117; stroke: #8b949e; stroke-width: 2; }
      .box-light { fill: #161b22; }
      .text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
               font-size: 20px; fill: #c9d1d9; }
      .label { font-size: 18px; fill: #c9d1d9; }
      .muted { fill: #8b949e; }
      .line { stroke: #8b949e; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Center guide (faint) -->
  <line x1="450" y1="20" x2="450" y2="780" class="line" opacity="0.12"/>

  <!-- Top: Discord API -->
  <rect x="275" y="60" width="350" height="60" class="box" rx="8" ry="8"/>
  <text x="450" y="98" text-anchor="middle" class="text">Discord API</text>

  <!-- Discord.js Layer -->
  <line x1="450" y1="120" x2="450" y2="160" class="line" marker-end="url(#arrow)"/>
  <rect x="275" y="160" width="350" height="60" class="box box-light" rx="8" ry="8"/>
  <text x="450" y="198" text-anchor="middle" class="text">[ Discord.js Layer ]</text>

  <!-- Split to two modules -->
  <line x1="450" y1="220" x2="450" y2="260" class="line"/>
  <line x1="300" y1="260" x2="600" y2="260" class="line"/>
  <line x1="300" y1="260" x2="300" y2="300" class="line" marker-end="url(#arrow)"/>
  <line x1="600" y1="260" x2="600" y2="300" class="line" marker-end="url(#arrow)"/>

  <!-- Event Handlers box (left) -->
  <rect x="170" y="300" width="260" height="120" class="box" rx="8" ry="8"/>
  <text x="300" y="340" text-anchor="middle" class="text">Event Handlers</text>
  <text x="300" y="370" text-anchor="middle" class="label muted">(messages, roles)</text>

  <!-- Commands box (right) -->
  <rect x="470" y="300" width="260" height="120" class="box" rx="8" ry="8"/>
  <text x="600" y="340" text-anchor="middle" class="text">Commands</text>
  <text x="600" y="370" text-anchor="middle" class="label muted">(slash, text)</text>

  <!-- Merge down to Config -->
  <line x1="300" y1="420" x2="300" y2="460" class="line"/>
  <line x1="600" y1="420" x2="600" y2="460" class="line"/>
  <line x1="300" y1="460" x2="600" y2="460" class="line"/>
  <line x1="450" y1="460" x2="450" y2="500" class="line" marker-end="url(#arrow)"/>

  <!-- JSON Config + ENV -->
  <rect x="275" y="500" width="350" height="70" class="box box-light" rx="8" ry="8"/>
  <text x="450" y="542" text-anchor="middle" class="text">[ JSON Config + ENV ]</text>

  <!-- Logging / Webhooks -->
  <line x1="450" y1="570" x2="450" y2="620" class="line" marker-end="url(#arrow)"/>
  <rect x="275" y="620" width="350" height="70" class="box box-light" rx="8" ry="8"/>
  <text x="450" y="662" text-anchor="middle" class="text">[ Logging / Webhooks ]</text>

  <!-- Footer note -->
  <text x="450" y="740" text-anchor="middle" class="label muted">Tempo-Bot Architecture</text>
</svg>
